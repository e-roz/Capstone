; AimPark firmware — PlatformIO project
;
; One environment per unit. They share this file rather than each carrying its
; own project folder, because every sketch here targets the same board and the
; same two libraries; only the source folder differs.
;
; Build and upload one env:   pio run -e enroll_reader -t upload
; Serial monitor:             pio device monitor -e enroll_reader

[platformio]
; Sketch folders sit directly under firmware/, so this directory is the source
; root and each environment narrows it down with build_src_filter below.
src_dir = .

[env]
platform = espressif32
framework = arduino

; "ESP32 Dev Module" in Arduino IDE terms — the 30- and 38-pin DevKit boards
; both flash with this. Change only if your board is a different chip (S2, S3,
; C3), not because the pin count differs.
board = esp32dev

; Matches Serial.begin(115200) in the sketches. If the monitor prints mojibake,
; this and the sketch have drifted apart.
monitor_speed = 115200

lib_deps =
    miguelbalboa/MFRC522@^1.4.10
    bblanchon/ArduinoJson@^7.0.0

[env:enroll_reader]
; The reader on the admin's desk. Without this filter PlatformIO would compile
; every sketch folder into one binary.
build_src_filter = +<aimpark_enroll_reader/>

; This board's auto-reset circuit doesn't reliably drop it into bootloader mode
; on its own ("Wrong boot mode detected (0x13)" on every upload). --before
; no_reset skips esptool's own reset attempt entirely: it just checks whether
; the chip is *already* in bootloader mode, which is what a manual BOOT-held
; power-cycle beforehand puts it in. Remove this once/if the board's own
; auto-reset is sorted out — it's a workaround, not the normal way to do this.
upload_flags =
    --before
    no_reset

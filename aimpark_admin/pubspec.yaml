name: aimpark_admin
description: "AimPark internal admin panel — web only."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1

  # Secure token storage (web uses localStorage under the hood)
  flutter_secure_storage: ^9.2.4

  # JWT decoding (no external dep needed — manual base64 decode)
  # dart:convert is available from the SDK

  # Date formatting
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Opening PDF document URLs in a new browser tab
  url_launcher: ^6.3.1
  fl_chart: ^1.2.0

  # Browser Blob + anchor, for handing the administrator a generated CSV.
  # The panel is web-only, so no conditional import is needed.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  # Both bundled rather than fetched, so the panel renders identically with no
  # network — the defence demo cannot depend on Google's font CDN.
  fonts:
    # Carries every dense, small-size surface: tables, forms, labels, badges.
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 600
    # Display face for page titles, KPI numerals and dialog headers.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 600
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 700
    # Eyebrow labels, timestamps, table headers, status pills — anywhere a
    # value reads as data rather than as prose.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

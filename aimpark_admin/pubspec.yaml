name: aimpark_admin
description: "AimPark internal admin panel — web only."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1

  # Secure token storage (web uses localStorage under the hood)
  flutter_secure_storage: ^9.2.4

  # JWT decoding (no external dep needed — manual base64 decode)
  # dart:convert is available from the SDK

  # Date formatting
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
